<VirtualHost *:*>
    DocumentRoot /var/www/html

    RedirectMatch 302 ^/$ /public/login.php

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/html/includes>
        Require all denied
    </Directory>

    <Files "config.php">
        Require all denied
    </Files>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
